name: Verify download on Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-download:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Download the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the downloaded archive
        shell: pwsh
        run: ./Verify-Archive.ps1 -RequireCleanOutputs
